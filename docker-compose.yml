name: scan-wifi-platform

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run pnpm setup:env first}
      POSTGRES_USER: ${POSTGRES_OWNER_USER:?Run pnpm setup:env first}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?Run pnpm setup:env first}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?Run pnpm setup:env first}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Run pnpm setup:env first}
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - scan_wifi_postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  scan_wifi_postgres:
